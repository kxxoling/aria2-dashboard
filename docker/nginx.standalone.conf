server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Optional basic auth, generated by the entrypoint when credentials are set
    include /etc/nginx/conf.d/auth.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Same-origin aria2 RPC: HTTP POST and WebSocket share this endpoint, so
    # the browser never needs to know a port or fight CORS/mixed content.
    location = /jsonrpc {
        proxy_pass http://127.0.0.1:6800/jsonrpc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Read-only aria2 log file (protected by the same optional basic auth
    # as the rest of the site). The UI fetches this for the Logs page.
    location = /aria2-log {
        alias /data/aria2.log;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
