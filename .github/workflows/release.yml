name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. v0.1.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract standalone metadata
        id: meta-standalone
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=standalone
            type=raw,value=${{ steps.version.outputs.version }}-standalone

      # All-in-one image: dashboard + nginx + aria2 in one container
      # (hurlenko/aria2-ariang style, pull and run with zero configuration)
      - name: Build and push standalone Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.standalone
          push: true
          tags: ${{ steps.meta-standalone.outputs.tags }}
          labels: ${{ steps.meta-standalone.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and zip extension
        run: bun run build:ext -- --zip

      - name: Smoke-test the packaged extension (virtual display)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          bunx playwright install --with-deps chromium
          xvfb-run --auto-servernum bunx playwright test e2e/extension.spec.ts

      - name: Attach zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp build/chrome-mv3-prod.zip "aria2-dashboard-extension-${TAG}.zip"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "aria2-dashboard-extension-${TAG}.zip" --clobber
          else
            echo "Release $TAG not found yet; skipping upload (re-run after the release exists)."
          fi

  update-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Prepend Docker image usage to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --json body --jq .body > notes.md 2>/dev/null; then
            echo "Release $TAG not found, skipping notes update."
            exit 0
          fi

          cat > image-notes.md <<'EOF'
          <!-- aria2-dashboard:image-notes:start -->
          ## Docker Images

          Web UI only — bring your own aria2 (`latest` and `sha-*` tags also available):

          ```bash
          docker run -d -p 8080:80 \
            -e ARIA2_RPC_URL=ws://your-aria2:6800/jsonrpc \
            __IMAGE__
          ```

          All-in-one (dashboard + aria2 in one container, zero configuration) — add `-standalone` to the tag:

          ```bash
          docker run -d -p 8080:80 -v downloads:/data \
            -e RPC_SECRET=changeme \
            __STANDALONE_IMAGE__
          ```
          <!-- aria2-dashboard:image-notes:end -->
          EOF
          sed -i "s|__IMAGE__|${IMAGE}:${TAG}|" image-notes.md
          sed -i "s|__STANDALONE_IMAGE__|${IMAGE}:${TAG}-standalone|" image-notes.md

          sed -i -e '/<!-- aria2-dashboard:image-notes:start -->/,/<!-- aria2-dashboard:image-notes:end -->/d' -e '/./,$!d' notes.md

          {
            cat image-notes.md
            echo ""
            cat notes.md
          } > final-notes.md

          gh release edit "$TAG" --notes-file final-notes.md
