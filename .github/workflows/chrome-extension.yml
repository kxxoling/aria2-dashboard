name: Build Chrome Extension

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docker/**"
      - "README.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docker/**"
      - "README.md"

jobs:
  build-crx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Build Extension
        run: bun run build:ext

      - name: Verify build output
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("build/chrome-mv3-prod/manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const errors = [];
            if (manifest.manifest_version !== 3) errors.push("not an MV3 manifest");
            if (manifest.version !== pkg.version) errors.push(`manifest version ${manifest.version} != package.json ${pkg.version}`);
            if (!manifest.action?.default_popup) errors.push("no default_popup");
            if (!manifest.key) errors.push("no fixed key (unstable extension id)");
            if (!fs.existsSync("build/chrome-mv3-prod/popup.html")) errors.push("popup.html missing");
            for (const size of [16, 32, 48, 128]) {
              if (!Object.values(manifest.icons ?? {}).some(p => p.includes(`icon${size}`))) errors.push(`icon${size} missing`);
            }
            if (errors.length) { console.error(errors.join("\n")); process.exit(1); }
            console.log("manifest ok:", manifest.name, manifest.version);
          '

      # Chrome 137+ disabled --load-extension in headless; run the popup
      # smoke tests against a virtual display instead.
      - name: Install virtual display and Playwright browser
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          bunx playwright install --with-deps chromium

      - name: Extension e2e (real Chromium profile)
        run: xvfb-run --auto-servernum bunx playwright test e2e/extension.spec.ts

      - name: Package zip
        run: bun run build:ext -- --zip

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-dashboard-extension
          path: build/chrome-mv3-prod.zip
